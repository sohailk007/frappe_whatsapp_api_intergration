{% extends "templates/web.html" %}

{% block page_content %}
<div class="whatsapp-messenger-wrapper">
    <div class="whatsapp-messenger-card">
        <div class="messenger-header">
            <div class="status-indicator success">
                <i class="fas fa-comment-alt"></i>
            </div>
            <h1>WhatsApp Messenger</h1>
            <p class="subtitle">Send messages securely</p>
        </div>

        <div class="messenger-content">
            <div class="message-form">
                <div class="form-group">
                    <label for="chat-id" class="form-label">Recipient Chat ID</label>
                    <input type="text" id="chat-id" class="form-control" placeholder="e.g., 917980764711@c.us">
                    <small class="form-text">Format: number@c.us for individuals, @g.us for groups, or @newsletter for channels</small>
                </div>

                <div class="form-group">
                    <label for="message-text" class="form-label">Message</label>
                    <textarea id="message-text" class="form-control" rows="4" placeholder="Type your message..."></textarea>
                </div>

                <div class="form-group optional">
                    <label for="mentions" class="form-label">Mentions (optional)</label>
                    <input type="text" id="mentions" class="form-control" placeholder="e.g., 123456789@c.us,987654321@c.us">
                    <small class="form-text">Comma-separated contact IDs for group chat mentions</small>
                </div>

                <div class="form-group optional">
                    <label for="reply-to-message-id" class="form-label">Reply to Message ID (optional)</label>
                    <input type="text" id="reply-to-message-id" class="form-control" placeholder="e.g., true_123456789@c.us_3EB0123456789ABCDEF">
                </div>

                <div class="form-group checkbox">
                    <label class="checkbox-label">
                        <input type="checkbox" id="preview-link" checked>
                        Show link previews
                    </label>
                </div>
            </div>

            <div id="status-message" class="alert alert-info" style="display: none;">
                <i class="fa fa-spinner fa-spin"></i> Sending...
            </div>
        </div>

        <div class="messenger-actions">
            <button id="back-btn" class="action-btn secondary">
                <i class="fas fa-arrow-left"></i>
                <span>Back</span>
            </button>
            <button id="send-btn" class="action-btn primary">
                <i class="fas fa-paper-plane"></i>
                <span>Send Message</span>
            </button>
        </div>
    </div>
</div>

<script>
frappe.ready(function() {
    // Elements
    const chatIdInput = document.getElementById('chat-id');
    const messageInput = document.getElementById('message-text');
    const mentionsInput = document.getElementById('mentions');
    const replyToMessageIdInput = document.getElementById('reply-to-message-id');
    const previewLinkCheckbox = document.getElementById('preview-link');
    const sendBtn = document.getElementById('send-btn');
    const backBtn = document.getElementById('back-btn');
    const statusEl = document.getElementById('status-message');

    // Update status display
    function updateStatus(message, type = "info") {
        const icons = {
            info: "fa-spinner fa-spin",
            success: "fa-check-circle",
            error: "fa-exclamation-circle"
        };
        statusEl.innerHTML = `<i class="fa ${icons[type]}"></i> ${message}`;
        statusEl.className = `alert alert-${type}`;
        statusEl.style.display = "block";
        setTimeout(() => { statusEl.style.display = "none"; }, 5000);
    }

    // Send message handler
    sendBtn.addEventListener('click', function() {
        const chatId = chatIdInput.value.trim();
        const message = messageInput.value.trim();
        const mentions = mentionsInput.value.trim();
        const replyToMessageId = replyToMessageIdInput.value.trim();
        const previewLink = previewLinkCheckbox.checked;

        if (!chatId || !message) {
            updateStatus("Chat ID and message are required", "error");
            return;
        }

        // Validate chat_id format
        if (!chatId.match(/.*@(c\.us|g\.us|newsletter)$/)) {
            updateStatus("Invalid chat ID format. Must end with @c.us, @g.us, or @newsletter", "error");
            return;
        }

        this.classList.add('loading');
        updateStatus("Sending message...", "info");

        frappe.call({
            method: 'waapi.api.waapi.send_whatsapp_message',
            args: {
                instance_id: "76432",
                chat_id: chatId,
                message: message,
                mentions: mentions ? mentions.split(',').map(m => m.trim()) : null,
                reply_to_message_id: replyToMessageId || null,
                preview_link: previewLink
            },
            callback: function(response) {
                sendBtn.classList.remove('loading');
                if (response.message.success) {
                    updateStatus("Message sent successfully", "success");
                    // Clear form
                    messageInput.value = '';
                    mentionsInput.value = '';
                    replyToMessageIdInput.value = '';
                } else {
                    updateStatus(response.message.message || "Failed to send message", "error");
                }
            },
            error: function(err) {
                sendBtn.classList.remove('loading');
                updateStatus("Failed to send message", "error");
                console.error("Send Message Error:", err);
            }
        });
    });

    // Back button handler
    backBtn.addEventListener('click', function() {
        this.classList.add('loading');
        setTimeout(() => {
            window.location.href = "/whatsapp_user_details";
        }, 300);
    });
});
</script>

<style>
/* Reset and base styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.whatsapp-messenger-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.whatsapp-messenger-card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 
        0 4px 6px -1px rgba(0, 0, 0, 0.1),
        0 2px 4px -1px rgba(0, 0, 0, 0.06);
    width: 100%;
    max-width: 500px;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(226, 232, 240, 0.8);
    animation: slideUp 0.6s ease-out;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.whatsapp-messenger-card:hover {
    transform: translateY(-2px);
    box-shadow: 
        0 10px 15px -3px rgba(0, 0, 0, 0.1),
        0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

/* Header Styles */
.messenger-header {
    background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    color: white;
    padding: 24px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.messenger-header::after {
    content: '';
    position: absolute;
    top: -50%;
    right: -20px;
    width: 100px;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transform: rotate(15deg);
    animation: shimmer 3s ease-in-out infinite;
}

@keyframes shimmer {
    0%, 100% { opacity: 0; transform: translateX(-100px) rotate(15deg); }
    50% { opacity: 1; transform: translateX(0) rotate(15deg); }
}

.status-indicator {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 20px;
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.3);
}

.messenger-header h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
    position: relative;
    z-index: 2;
    letter-spacing: -0.025em;
}

.subtitle {
    font-size: 14px;
    opacity: 0.9;
    font-weight: 400;
    position: relative;
    z-index: 2;
}

/* Content Styles */
.messenger-content {
    padding: 24px 20px;
}

.message-form {
    space-y: 16px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group.optional {
    opacity: 0.8;
}

.form-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 6px;
    color: #334155;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.form-control {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.5;
    color: #ebeef3; /* Dark gray for text, high contrast */
    background: #ffffff; /* White background for clarity */
    transition: all 0.2s ease;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
}

.form-control:focus {
    outline: none;
    border-color: #25D366; /* WhatsApp green for focus */
    background: #f8fafc; /* Slightly off-white for focus */
    box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.15), inset 0 1px 2px rgba(0, 0, 0, 0.05);
}

.form-control::placeholder {
    color: #6b7280; /* Lighter gray for placeholders, better readability */
    opacity: 1;
}

.form-control:disabled {
    background: #e5e7eb;
    color: #6b7280;
    cursor: not-allowed;
}

textarea.form-control {
    resize: vertical;
    min-height: 120px; /* Slightly taller for better usability */
}

.form-text {
    font-size: 12px;
    color: #4b5563;
    margin-top: 6px;
    display: block;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #334155;
    cursor: pointer;
}

.checkbox-label input {
    width: 18px;
    height: 18px;
    accent-color: #25D366;
    border-radius: 4px;
}

/* Status Message */
.alert {
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.alert-info {
    background: #e0f2fe;
    color: #075985;
    border: 1px solid #bae6fd;
}

.alert-success {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #bbf7d0;
}

.alert-error {
    background: #fee2e2;
    color: #dc2626;
    border: 1px solid #fecaca;
}

/* Action Buttons */
.messenger-actions {
    padding: 0 20px 20px;
    display: flex;
    gap: 12px;
}

.action-btn {
    flex: 1;
    height: 48px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
}

.action-btn.primary {
    background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(37, 211, 102, 0.25);
}

.action-btn.secondary {
    background: #f8fafc;
    color: #374151;
    border: 1px solid #d1d5db;
}

.action-btn:hover {
    transform: translateY(-1px);
}

.action-btn.primary:hover {
    box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
}

.action-btn.secondary:hover {
    background: #e5e7eb;
    border-color: #9ca3af;
    color: #1f2937;
}

.action-btn.loading {
    pointer-events: none;
    opacity: 0.7;
}

.action-btn.loading i {
    animation: spin 1s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Responsive Design */
@media (max-width: 480px) {
    .whatsapp-messenger-wrapper {
        padding: 16px;
    }

    .whatsapp-messenger-card {
        max-width: 100%;
    }

    .messenger-header {
        padding: 20px 16px;
    }

    .messenger-content {
        padding: 20px 16px;
    }

    .messenger-header h1 {
        font-size: 18px;
    }

    .subtitle {
        font-size: 13px;
    }

    .messenger-actions {
        padding: 0 16px 16px;
        flex-direction: column;
    }

    .action-btn {
        height: 44px;
        font-size: 14px;
    }

    .form-control {
        padding: 10px 14px;
        font-size: 14px;
    }

    textarea.form-control {
        min-height: 100px;
    }
}

/* Dark mode support */
@media (prefers-color-scheme: dark) {
    .whatsapp-messenger-wrapper {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }

    .whatsapp-messenger-card {
        background: #1e293b;
        border-color: #374151;
    }

    .form-control {
        background: #374151;
        border-color: #4b5563;
        color: #e5e7eb; /* Light text for dark mode */
    }

    .form-control:focus {
        background: #f6f8fa;
        border-color: #25D366;
        box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.15);
    }

    .form-control::placeholder {
        color: #9ca3af; /* Lighter placeholder in dark mode */
    }

    .form-control:disabled {
        background: #4b5563;
        color: #9ca3af;
    }

    .form-label {
        color: #d1d5db;
    }

    .form-text {
        color: #9ca3af;
    }

    .checkbox-label {
        color: #d1d5db;
    }

    .action-btn.secondary {
        background: #374151;
        border-color: #4b5563;
        color: #d1d5db;
    }

    .action-btn.secondary:hover {
        background: #4b5563;
        border-color: #6b7280;
        color: #e5e7eb;
    }

    .alert-info {
        background: rgba(14, 165, 233, 0.2);
        color: #38bdf8;
        border-color: rgba(14, 165, 233, 0.3);
    }

    .alert-success {
        background: rgba(34, 197, 94, 0.2);
        color: #4ade80;
        border-color: rgba(34, 197, 94, 0.3);
    }

    .alert-error {
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
        border-color: rgba(239, 68, 68, 0.3);
    }
}

/* High contrast mode */
@media (prefers-contrast: high) {
    .whatsapp-messenger-card {
        border: 2px solid #25D366;
    }

    .form-control {
        border: 2px solid #1f2937;
        color: #000000;
        background: #ffffff;
    }

    .form-control:focus {
        border-color: #25D366;
        box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.3);
    }

    .form-control::placeholder {
        color: #4b5563;
    }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
</style>

{% endblock %}
